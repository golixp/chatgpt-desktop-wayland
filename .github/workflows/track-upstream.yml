name: Track official ChatGPT Linux release

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: Rebuild the pinned recipe even when the official version is unchanged
        type: boolean
        default: false
      upload_package:
        description: Retain the tested Arch package for local installation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: track-chatgpt-linux
  cancel-in-progress: false

env:
  PACKAGE_NAME: chatgpt-desktop-wayland

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.state.outputs.base_sha }}
      needs_build: ${{ steps.state.outputs.needs_build }}
    steps:
      - name: Check out recipe
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Test candidate and validation policy
        run: python -m unittest discover -s tests -v

      - name: Verify signed upstream metadata
        id: upstream
        env:
          UPSTREAM_METADATA: ${{ runner.temp }}/upstream.json
        run: |
          set -Eeuo pipefail
          python scripts/fetch_upstream_metadata.py \
            --key openai-codex-linux-repository-key.gpg.base64 \
            --metadata "$UPSTREAM_METADATA"
          # Track official releases automatically; builder changes need a reviewed
          # pin update because local patches depend on its source layout.
          builder_commit="$(python - <<'PYTHON'
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts")
          from recipe_digest import read_pkgbuild_value
          print(read_pkgbuild_value(Path("PKGBUILD").read_text(), "_builder_commit"))
          PYTHON
          )"
          [[ "$builder_commit" =~ ^[0-9a-f]{40}$ ]]
          echo "builder_commit=$builder_commit" >> "$GITHUB_OUTPUT"

      - name: Update candidate pins
        env:
          UPSTREAM_METADATA: ${{ runner.temp }}/upstream.json
          BUILDER_COMMIT: ${{ steps.upstream.outputs.builder_commit }}
        run: |
          set -Eeuo pipefail
          python scripts/track_upstream.py \
            "$UPSTREAM_METADATA" PKGBUILD .SRCINFO "$BUILDER_COMMIT"
          python - "$UPSTREAM_METADATA" "$BUILDER_COMMIT" upstream.json <<'PY'
          import json
          import pathlib
          import sys

          metadata = json.loads(pathlib.Path(sys.argv[1]).read_text())
          metadata.pop("depends", None)
          metadata["builder_commit"] = sys.argv[2]
          pathlib.Path(sys.argv[3]).write_text(json.dumps(metadata, indent=2, sort_keys=True) + "\n")
          PY

      - name: Decide whether a fresh build is required
        id: state
        env:
          FORCE_BUILD: ${{ inputs.force_build || false }}
        run: |
          set -Eeuo pipefail
          base_sha="$(git rev-parse HEAD)"
          recipe_changed=false
          if ! git diff --quiet -- PKGBUILD .SRCINFO upstream.json; then
            recipe_changed=true
          fi
          needs_build=false
          if [[ "$FORCE_BUILD" == true ]] || [[ "$recipe_changed" == true ]] || \
             [[ ! -f .ci/validated.json ]] || \
             ! python scripts/recipe_digest.py --verify .ci/validated.json; then
            needs_build=true
          fi
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "needs_build=$needs_build" >> "$GITHUB_OUTPUT"
          printf 'base=%s recipe_changed=%s needs_build=%s\n' "$base_sha" "$recipe_changed" "$needs_build"

      - name: Assemble candidate recipe artifact
        run: |
          set -Eeuo pipefail
          python scripts/recipe_digest.py --copy-to candidate
          if [[ -f .ci/validated.json ]]; then
            mkdir -p candidate/.ci
            cp .ci/validated.json candidate/.ci/
          fi

      - name: Upload candidate recipe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-recipe
          path: candidate
          include-hidden-files: true
          if-no-files-found: error

  build:
    needs: discover
    if: needs.discover.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    defaults:
      run:
        shell: bash
    steps:
      - name: Download candidate recipe
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate-recipe
          path: recipe

      - name: Install isolated Arch build dependencies
        run: |
          set -Eeuo pipefail
          mapfile -t package_deps < <(
            sed -n -E 's/^[[:space:]]*(depends|makedepends|checkdepends) = //p' recipe/.SRCINFO | sort -u
          )
          pacman -Syu --noconfirm --needed \
            archlinux-keyring base-devel "${package_deps[@]}"
          useradd --create-home --uid 1000 package-builder
          mkdir -p recipe/build-diagnostics
          pacman -Q > recipe/build-diagnostics/packages.txt
          chown -R package-builder:package-builder recipe

      - name: Validate metadata and preflight upstream compatibility
        id: preflight
        run: |
          set -Eeuo pipefail
          cd recipe
          generated="$(mktemp)"
          runuser -u package-builder -- makepkg --printsrcinfo > "$generated"
          diff -u .SRCINFO "$generated" | tee build-diagnostics/srcinfo.diff
          # prepare() verifies the package and patches a temporary ASAR copy;
          # incompatible bundles stop before any native helper compilation.
          runuser -u package-builder -- makepkg --cleanbuild --nobuild --noconfirm \
            2>&1 | tee build-diagnostics/prepare.log

      - name: Compile helpers, test, and package the validated candidate
        id: package
        run: |
          set -Eeuo pipefail
          cd recipe
          # Reuse precisely the sources that passed prepare(); do not run it twice.
          runuser -u package-builder -- makepkg --noextract --noconfirm \
            2>&1 | tee build-diagnostics/build.log

      - name: Record validated recipe digest
        run: |
          set -Eeuo pipefail
          cd recipe
          python scripts/recipe_digest.py --output .ci/validated.json
          sha256sum ./*.pkg.tar.zst > build-diagnostics/package-sha256.txt

      - name: Upload installable package
        if: github.event_name == 'workflow_dispatch' && inputs.upload_package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chatgpt-desktop-wayland-package
          path: |
            recipe/*.pkg.tar.zst
            recipe/build-diagnostics/package-sha256.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

      - name: Upload validated recipe marker
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-recipe
          path: recipe/.ci/validated.json
          include-hidden-files: true
          if-no-files-found: error

      - name: Summarize build stages
        if: always()
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
        run: |
          {
            printf '## ChatGPT package validation\n\n'
            printf '| Stage | Result |\n| --- | --- |\n'
            printf '| Compatibility preflight | %s |\n' "$PREFLIGHT_OUTCOME"
            printf '| Native build, tests and packaging | %s |\n\n' "$PACKAGE_OUTCOME"
            if [[ "$PREFLIGHT_OUTCOME" == failure ]]; then
              printf 'The candidate was rejected before native compilation. Inspect `build-diagnostics` for the patch contract report and preparation log. Review the pinned builder and adapters before retrying; critical checks remain enabled.\n'
            elif [[ "$PACKAGE_OUTCOME" == failure ]]; then
              printf 'Compatibility preflight passed. Inspect `build.log` for the native compiler, runtime-test or packaging failure.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-diagnostics
          path: recipe/build-diagnostics/
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: [discover, build]
    if: >-
      always() && needs.discover.result == 'success' &&
      (needs.build.result == 'success' || needs.discover.outputs.needs_build == 'false')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the expected recipe revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Download candidate recipe
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate-recipe
          path: candidate

      - name: Download fresh validation marker
        if: needs.discover.outputs.needs_build == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: validated-recipe
          path: candidate/.ci

      - name: Verify candidate before publishing
        env:
          BASE_SHA: ${{ needs.discover.outputs.base_sha }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          [[ "$(git rev-parse origin/main)" == "$BASE_SHA" ]]
          python scripts/recipe_digest.py candidate --verify candidate/.ci/validated.json

      - name: Commit validated recipe to GitHub
        run: |
          set -Eeuo pipefail
          mapfile -t recipe_files < <(python scripts/recipe_digest.py --list-files recipe)
          mapfile -t retired_files < <(python scripts/recipe_digest.py --list-files retired)
          python scripts/recipe_digest.py candidate --copy-to . --scope recipe
          mkdir -p .ci
          cp candidate/.ci/validated.json .ci/
          git config user.name 'chatgpt-desktop-wayland updater'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch -- "${retired_files[@]}"
          git add -- "${recipe_files[@]}" .ci/validated.json
          if git diff --cached --quiet; then
            echo 'recipe is already current'
            exit 0
          fi
          version="$(sed -n 's/^pkgver=//p' candidate/PKGBUILD | head -1)"
          git commit -m "chore: track ChatGPT Linux ${version}"
          git push origin HEAD:main

      - name: Push the same validated recipe to AUR
        if: vars.AUR_PUBLISH_ENABLED == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_KNOWN_HOSTS: ${{ secrets.AUR_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          [[ -n "$AUR_SSH_PRIVATE_KEY" && -n "$AUR_KNOWN_HOSTS" ]]
          ssh_dir="$RUNNER_TEMP/ssh"
          install -d -m 700 "$ssh_dir"
          install -m 600 /dev/null "$ssh_dir/id_ed25519"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$ssh_dir/id_ed25519"
          printf '%s\n' "$AUR_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$ssh_dir/known_hosts"

          aur="$RUNNER_TEMP/aur"
          git clone "ssh://aur@aur.archlinux.org/${PACKAGE_NAME}.git" "$aur"
          mapfile -t recipe_files < <(python scripts/recipe_digest.py --list-files recipe)
          mapfile -t retired_files < <(python scripts/recipe_digest.py --list-files retired)
          cd "$aur"
          extra="$(git ls-files | sort -u | comm -23 - <(
            printf '%s\n' "${recipe_files[@]}" "${retired_files[@]}" | sort -u
          ))"
          [[ -z "$extra" ]] || {
            printf 'unexpected files already present in AUR checkout:\n%s\n' "$extra" >&2
            exit 1
          }
          python "$GITHUB_WORKSPACE/scripts/recipe_digest.py" \
            "$GITHUB_WORKSPACE/candidate" --copy-to "$aur" --scope recipe
          git config user.name 'chatgpt-desktop-wayland updater'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch -- "${retired_files[@]}"
          git add -- "${recipe_files[@]}"
          if git diff --cached --quiet; then
            echo 'AUR already matches the validated recipe'
            exit 0
          fi
          git commit -m 'chore: track ChatGPT Linux'
          git push origin HEAD:master
